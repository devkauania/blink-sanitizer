[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blink-sanitizer"
version = "0.2.0"
description = "Sub-millisecond prompt injection detection for LLM applications — 259 regex patterns across 11 languages with zero dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kauan Mendes", email = "kauanmendes@blinkai.com.br" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["llm", "security", "prompt-injection", "sanitizer", "ai-safety", "guardrails"]
dependencies = []

[project.urls]
Homepage = "https://blinkai.com.br"
Repository = "https://github.com/devkauania/blink-sanitizer"
Documentation = "https://github.com/devkauania/blink-sanitizer#readme"
Issues = "https://github.com/devkauania/blink-sanitizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blink_sanitizer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
