[project]
name = "blink"
version = "0.1.0"
description = "AI Agent Edge-Gateway for RevOps — Governance, Orchestration & Dynamic Routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/gateway",
    "packages/cache",
    "packages/orchestration",
    "packages/persistence",
    "packages/agents",
    "packages/governance",
    "packages/shared",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "pre-commit>=4.0",
    # "pyrit>=0.11",  # Install separately: conflicts with nemoguardrails (pillow version). Use: uv pip install pyrit
    "pyyaml>=6.0",
    "mcp[cli]>=1.2",
    "garak>=0.14",
]

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "tests"]
asyncio_mode = "auto"
# Note: Running `pytest packages/*/tests/` together fails due to conftest namespace collision.
# Use `make test` (runs per-package sequentially) instead.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "security: marks security/red-team tests",
    "integration: marks integration tests requiring external services",
    "garak: Garak scanner tests (require Ollama running on localhost:11434)",
    "e2e: end-to-end integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short -q"

# ============================================================
# Ruff Configuration
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "tests"]
extend-exclude = ["tools/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012", # mutable class variables (Pydantic models)
    "TC001",  # runtime imports: FastAPI Depends, @runtime_checkable, Pydantic, SQLAlchemy
    "TC002",  # runtime imports: pytest, starlette.Request, AsyncSession, Celery, Redis
    "TC003",  # runtime imports: datetime in Pydantic/SQLAlchemy Mapped[] fields
]

[tool.ruff.lint.isort]
known-first-party = [
    "shared", "cache", "orchestration",
    "persistence", "agents", "gateway", "governance",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]   # Allow assert in tests

# ============================================================
# Mypy Configuration
# ============================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "docs/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
